<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign In — Seal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --cream:#FAF7F0; --cream-deep:#F1EBDD; --paper:#FFFFFF;
    --ink:#211D14; --ink-soft:#4A4436; --ink-muted:#6B6455; --ink-faint:#A39C89;
    --hairline:#E4DCC8; --hairline-strong:#D2C7AC;
    --accent:#2F4F46; --accent-ink:#1E332E; --accent-soft:#E3EAE7;
    --shadow-2: 0 12px 32px rgba(33,29,20,0.14), 0 2px 8px rgba(33,29,20,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);font-family:'Public Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1{font-family:'Source Serif 4',serif;margin:0;font-weight:600;letter-spacing:-0.01em;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  button{font-family:inherit;cursor:pointer;}
  label.field-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:7px;}
  input[type=text],input[type=email]{width:100%;height:44px;border:1px solid var(--hairline-strong);border-radius:2px;background:var(--paper);padding:0 14px;font-size:14px;font-family:inherit;color:var(--ink);transition:border-color 160ms ease;}
  input::placeholder{color:var(--ink-muted);}
  input:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent);}
  .btn-primary{background:var(--accent);color:var(--cream);border:1px solid var(--accent);border-radius:4px;height:46px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:background 160ms ease, transform 160ms ease;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-primary:active{transform:scale(0.99);}
  .avatar{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform 160ms ease, border-color 160ms ease;position:relative;}
  .avatar:hover{transform:translateY(-2px);}
  .avatar.selected{border-color:var(--accent);}
  .avatar.selected::after{content:'';position:absolute;inset:-5px;border:1px solid var(--accent);border-radius:50%;}
</style>
</head>
<body>

<div style="width: 1200px; height: 800px; background: var(--cream); display: flex; align-items: center; justify-content: center; position: relative;">

  <div style="position: absolute; top: 32px; left: 40px; display: flex; align-items: center; gap: 10px;">
    <div style="width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center;">
      <span style="font-family:'Source Serif 4',serif; color: var(--cream); font-size: 14px; font-weight: 700;">S</span>
    </div>
    <span style="font-family:'Source Serif 4',serif; font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Seal</span>
  </div>

  <div style="width: 440px; background: var(--paper); border: 1px solid var(--hairline); border-radius: 10px; box-shadow: var(--shadow-2); padding: 44px 40px 36px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 28px;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
        <span style="font-family:'Source Serif 4',serif; color: var(--cream); font-size: 24px; font-weight: 600;">S</span>
      </div>
      <h1 style="font-size: 22px;">Sign in to Seal</h1>
      <div style="font-size: 13px; color: var(--ink-muted); text-align: center; max-width: 300px; line-height: 1.5;">Certificate automation for your classroom</div>
    </div>

    <form style="display: flex; flex-direction: column; gap: 18px;">
      <div>
        <label class="field-label" for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. jalvarez">
      </div>
      <div>
        <label class="field-label" for="email">School email</label>
        <input type="email" id="email" placeholder="e.g. j.alvarez@lincolnhigh.edu">
      </div>

      <div>
        <label class="field-label">Choose an avatar</label>
        <div style="display: flex; gap: 12px; padding-top: 2px;">
          <div class="avatar" style="background: conic-gradient(from 45deg, #2F4F46, #E3EAE7 40%, #2F4F46 80%);"></div>
          <div class="avatar selected" style="background: linear-gradient(135deg, #9C7A2E 50%, #F1E9D3 50%);"></div>
          <div class="avatar" style="background: radial-gradient(circle at 35% 35%, #B8862E, #F1EBDD 70%);"></div>
          <div class="avatar" style="background: linear-gradient(160deg, #B23B2E, #3F7D52 60%);"></div>
          <div class="avatar" style="background: conic-gradient(#4A4436 0deg 90deg, #F1EBDD 90deg 180deg, #4A4436 180deg 270deg, #F1EBDD 270deg 360deg);"></div>
          <div class="avatar" style="background: linear-gradient(90deg, #2F4F46 33%, #F1EBDD 33% 66%, #9C7A2E 66%);"></div>
        </div>
      </div>

      <button type="button" class="btn-primary" style="margin-top: 8px;">Continue</button>
    </form>

    <div style="margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-muted); line-height: 1.6; text-align: center;">
      No password required &mdash; access is scoped to your Google account for Sheets, Forms and Gmail.
    </div>
  </div>

  <div style="position: absolute; bottom: 28px; font-size: 12px; color: var(--ink-muted);">Lincoln High School &middot; Certificate Desk</div>
</div>

</body>
</html>
